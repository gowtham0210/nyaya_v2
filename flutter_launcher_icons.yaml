# App icon for iOS and Android: `dart run flutter_launcher_icons`.
# Sources are in assets/icon (from the Nyaya Kural Justice Emblem, 2026-11-16).
flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"
  ios: true
  # The App Store refuses icons with transparency.
  remove_alpha_ios: true
  android: "ic_launcher"
  min_sdk_android: 26
  # Android shapes the icon itself (circle, squircle…): the emblem on its own maroon.
  adaptive_icon_background: "#580403"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  # The foreground PNG already keeps the emblem inside the always-visible circle.
  adaptive_icon_foreground_inset: 0
