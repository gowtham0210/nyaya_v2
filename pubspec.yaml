name: nyaya
description: "Nyaya — a gamified Indian law quiz app."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  confetti: ^0.8.0
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  go_router: ^18.1.1
  google_fonts: ^9.0.0
  http: ^1.6.0
  intl: ^0.20.3
  material_ui: ^1.8.0
  package_info_plus: ^10.2.2
  sentry_flutter: 10.1.0
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
