# Nyaya v2 staging. Installed on the VPS as
# /opt/yercaud/nginx/user_conf.d/nyaya-v2-staging.conf (the yercaud project's
# nginx-certbot container). The image requests a Let's Encrypt certificate for
# each /etc/letsencrypt/live/<name>/ named below. yercaud.conf defines
# `resolver` and $connection_upgrade; proxy_pass uses a variable so container
# IPs are re-resolved per request.
server {
	listen 443 ssl;
	listen [::]:443 ssl;
	http2 on;
	server_name staging-api.deepwebstudio.dev;

	ssl_certificate /etc/letsencrypt/live/staging-api.deepwebstudio.dev/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/staging-api.deepwebstudio.dev/privkey.pem;

	client_max_body_size 1m;

	location / {
		set $upstream_nyaya_v2_api http://nyaya-v2-api:3000;
		proxy_pass $upstream_nyaya_v2_api;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}
}

server {
	listen 443 ssl;
	listen [::]:443 ssl;
	http2 on;
	server_name staging-cms.deepwebstudio.dev;

	ssl_certificate /etc/letsencrypt/live/staging-cms.deepwebstudio.dev/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/staging-cms.deepwebstudio.dev/privkey.pem;

	location / {
		set $upstream_nyaya_v2_cms http://nyaya-v2-cms:3001;
		proxy_pass $upstream_nyaya_v2_cms;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection $connection_upgrade;
	}
}
